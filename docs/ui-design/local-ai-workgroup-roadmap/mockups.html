<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hub Workgroup UI Mockups</title>
    <style>
      :root {
        --bg: #081016;
        --chrome: #0d1720;
        --side: #0f1c24;
        --panel: #101d27;
        --panel-2: #142331;
        --line: #263747;
        --line-soft: rgba(255, 255, 255, 0.08);
        --text: #edf5f3;
        --muted: #95a4ae;
        --soft: #c8d3d2;
        --blue: #3a82ff;
        --cyan: #26c6bc;
        --green: #3cc76a;
        --amber: #f29f31;
        --orange: #ff7d38;
        --violet: #9b6bff;
        --red: #ef5f58;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 18% 12%, rgba(38, 198, 188, 0.12), transparent 28%),
          radial-gradient(circle at 82% 8%, rgba(58, 130, 255, 0.1), transparent 32%),
          #05090d;
        color: var(--text);
        font-family:
          "Avenir Next",
          "SF Pro Text",
          "Segoe UI",
          sans-serif;
      }

      .mockup {
        width: 1440px;
        height: 960px;
        margin: 40px auto;
        padding: 10px;
        background: linear-gradient(135deg, #0b131a, #111b22 48%, #0b1218);
      }

      .app {
        height: 100%;
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr) 378px;
        grid-template-rows: 42px minmax(0, 1fr);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      }

      .topbar {
        grid-column: 1 / 4;
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr) 378px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        background: #0a131b;
      }

      .traffic {
        display: flex;
        gap: 8px;
        padding-left: 16px;
      }

      .traffic span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .traffic span:nth-child(1) {
        background: #ff5f57;
      }

      .traffic span:nth-child(2) {
        background: #febc2e;
      }

      .traffic span:nth-child(3) {
        background: #28c840;
      }

      .window-title {
        justify-self: center;
        color: var(--soft);
        font-weight: 700;
        letter-spacing: 0;
      }

      .top-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        padding-right: 16px;
        color: var(--muted);
        font-size: 13px;
      }

      .icon {
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
      }

      .avatar,
      .topic-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 50%;
        color: #ffffff;
        font-size: 12px;
        font-weight: 800;
        background: var(--blue);
      }

      .avatar.cyan,
      .topic-icon.cyan {
        background: var(--cyan);
      }

      .avatar.green {
        background: var(--green);
      }

      .avatar.amber {
        background: var(--amber);
      }

      .avatar.orange {
        background: var(--orange);
      }

      .avatar.violet {
        background: var(--violet);
      }

      .avatar.red {
        background: var(--red);
      }

      .sidebar {
        grid-column: 1;
        grid-row: 2;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 14px;
        background: linear-gradient(180deg, #101d27, #0d1820);
        border-right: 1px solid var(--line);
      }

      .project-switcher {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr) 18px;
        gap: 10px;
        align-items: center;
        min-height: 58px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(58, 130, 255, 0.6);
        border-radius: 8px;
        color: var(--blue);
        font-weight: 900;
      }

      .project-name,
      .row-title {
        overflow: hidden;
        color: var(--text);
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .small,
      .row-subtitle,
      .time {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .section {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .section-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 6px;
        color: #84939d;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .project-row,
      .topic-row,
      .status-row {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr) auto;
        gap: 9px;
        align-items: center;
        min-height: 36px;
        padding: 7px 8px;
        border: 1px solid transparent;
        border-radius: 7px;
        color: var(--soft);
        background: transparent;
      }

      .project-row.selected,
      .topic-row.selected {
        border-color: rgba(58, 130, 255, 0.32);
        background: rgba(58, 130, 255, 0.18);
      }

      .project-dot,
      .topic-hash,
      .status-dot {
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: var(--blue);
        font-weight: 900;
      }

      .project-dot {
        background: rgba(58, 130, 255, 0.22);
      }

      .topic-hash {
        color: var(--muted);
        font-size: 18px;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        align-self: center;
        background: var(--green);
      }

      .count,
      .pill,
      .chip,
      .review-state {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 7px;
        color: var(--soft);
        background: rgba(255, 255, 255, 0.04);
        font-size: 11px;
        font-weight: 720;
        white-space: nowrap;
      }

      .pill.blue,
      .chip.blue {
        border-color: rgba(58, 130, 255, 0.4);
        color: #9fc2ff;
        background: rgba(58, 130, 255, 0.18);
      }

      .pill.green,
      .chip.green {
        border-color: rgba(60, 199, 106, 0.38);
        color: #83e5a2;
        background: rgba(60, 199, 106, 0.14);
      }

      .pill.amber,
      .chip.amber {
        border-color: rgba(242, 159, 49, 0.45);
        color: #ffc06f;
        background: rgba(242, 159, 49, 0.16);
      }

      .pill.violet,
      .chip.violet {
        border-color: rgba(155, 107, 255, 0.42);
        color: #c7b2ff;
        background: rgba(155, 107, 255, 0.16);
      }

      .pill.red,
      .chip.red {
        border-color: rgba(239, 95, 88, 0.45);
        color: #ffaaa5;
        background: rgba(239, 95, 88, 0.14);
      }

      .footer-state {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--line-soft);
      }

      .main {
        grid-column: 2;
        grid-row: 2;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-width: 0;
        background:
          linear-gradient(180deg, rgba(20, 35, 49, 0.74), rgba(8, 16, 22, 0.92)),
          var(--bg);
      }

      .room-header {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        min-height: 96px;
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--line);
      }

      .topic-icon {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        font-size: 28px;
        background: rgba(58, 130, 255, 0.16);
        border: 1px solid rgba(58, 130, 255, 0.54);
      }

      .room-title {
        margin: 0 0 4px;
        font-size: 26px;
        letter-spacing: 0;
      }

      .room-subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .room-actions {
        display: flex;
        gap: 8px;
      }

      .chat-scroll {
        overflow: hidden;
        padding: 16px 22px;
      }

      .message-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) 46px;
        gap: 10px;
        align-items: start;
      }

      .message-body {
        min-width: 0;
        padding: 9px 12px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.025);
      }

      .message.user .message-body {
        border-color: rgba(58, 130, 255, 0.26);
        background: rgba(58, 130, 255, 0.08);
      }

      .message.system .message-body {
        border-color: rgba(242, 159, 49, 0.26);
        background: rgba(242, 159, 49, 0.08);
      }

      .message-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
      }

      .message-head strong {
        font-size: 14px;
      }

      .message p {
        margin: 0;
        color: #d2dcde;
        font-size: 13px;
        line-height: 1.45;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .run-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        margin-top: 9px;
        padding: 10px;
        border: 1px solid rgba(38, 198, 188, 0.26);
        border-radius: 8px;
        background: rgba(38, 198, 188, 0.07);
      }

      .run-card h3 {
        margin: 0 0 4px;
        font-size: 13px;
      }

      .composer {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) 34px 34px;
        gap: 10px;
        align-items: center;
        margin: 0 16px 14px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
      }

      .composer-input {
        color: var(--muted);
        font-size: 13px;
      }

      .send {
        color: #ffffff;
        background: var(--blue);
        border-color: rgba(58, 130, 255, 0.6);
      }

      .right {
        grid-column: 3;
        grid-row: 2;
        padding: 14px;
        overflow: hidden;
        background: linear-gradient(180deg, #101d27, #0a131b);
        border-left: 1px solid var(--line);
      }

      .review-tabs {
        display: flex;
        gap: 4px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }

      .review-tabs span {
        padding: 6px 8px;
        border-radius: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .review-tabs .active {
        color: #ffffff;
        background: rgba(58, 130, 255, 0.2);
      }

      .review-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-top: 12px;
      }

      .review-card {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
      }

      .review-card h3 {
        margin: 0 0 8px;
        font-size: 14px;
      }

      .review-card p,
      .kv-row {
        margin: 0;
        color: #c8d3d2;
        font-size: 12px;
        line-height: 1.45;
      }

      .kv-row {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 8px;
        padding: 4px 0;
      }

      .kv-row span:first-child {
        color: var(--muted);
      }

      .phase-label {
        color: #9aa9b0;
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const currentTabs = ["Summary", "Diff", "Tests", "Risk", "Memory", "Logs"];

      const phases = [
        {
          id: "phase-02",
          file: "phase-02-rooms.png",
          label: "Phase 2 Rooms",
          topic: "# planning",
          subtitle: "ConversationThread becomes a room/topic without replacing the current chat path.",
          activeTopic: "planning",
          selectedProject: "agenthub-core",
          messages: [
            user("MK", "09:00", "Use the existing thread list as project topics. Keep the center as a normal chat conversation."),
            system("AH", "09:01", "Default topics can map to existing conversation threads: #general, #planning, #research, #review, #knowledge.", ["thread metadata", "no room table"]),
            agent("Fake", "09:02", "I created a room metadata preview. The current renderer still calls window.agentHub.threads.*.", ["runtime injection", "SQLite thread"], "completed")
          ],
          reviewTitle: "Selected Topic",
          review: [
            ["Backing store", "conversation_threads"],
            ["Current IPC", "threads.list / get / create / sendMessage"],
            ["Review boundary", "Run evidence loads only when selected"]
          ],
          cards: [
            card("Compatibility", "Older threads remain readable as custom topics."),
            card("Simplification", "No team list here; left side is Projects plus Topics only.")
          ]
        },
        {
          id: "phase-03",
          file: "phase-03-mention-task-grouping.png",
          label: "Phase 3 Grouping",
          topic: "# research",
          subtitle: "One prompt fans out into linked run cards while staying in the same IM-style thread.",
          activeTopic: "research",
          selectedProject: "agenthub-core",
          messages: [
            user("MK", "10:13", "@fake @codex analyze the retained-worktree handoff and summarize risks."),
            system("AH", "10:14", "Created one shared task shell and linked two current adapter runs.", ["task row", "run cards"]),
            agent("Fake", "10:16", "Drafted a bounded summary with no repository side effects.", ["run 311", "completed"], "completed"),
            agent("Codex", "10:17", "Codex preflight is inspectable; unavailable CLIs fail as persisted events.", ["run 312", "inspect"], "running")
          ],
          reviewTitle: "Grouped Runs",
          review: [
            ["Current behavior", "one run per selected agent"],
            ["Design target", "shared task id appears in metadata"],
            ["Evidence", "each run opens the same inspector tabs"]
          ],
          cards: [
            card("RunService", "CreateRun can accept an existing task id later."),
            card("UI rule", "Run cards are grouped visually, not hidden.")
          ]
        },
        {
          id: "phase-04",
          file: "phase-04-timeline-events.png",
          label: "Phase 4 Timeline",
          topic: "# review",
          subtitle: "The chat stays readable while system rows make audit events explicit.",
          activeTopic: "review",
          selectedProject: "agenthub-core",
          messages: [
            user("MK", "11:02", "Review the comparison output and call out any blocking risk."),
            system("AH", "11:03", "TaskRunner emitted context, worktree, adapter, verification, and terminal lifecycle events.", ["persisted events"]),
            agent("Codex", "11:07", "Implementation run completed. Verification passed. One memory proposal was generated.", ["check passed", "memory proposal"], "completed"),
            system("Risk", "11:08", "Medium risk: changed-file footprint needs review before accepting.", ["risk", "review required"])
          ],
          reviewTitle: "Event Inspector",
          review: [
            ["Message kind", "user / system / agent_run / assistant"],
            ["Linked run", "run_447"],
            ["Lazy evidence", "diff, tests, risk, memory, logs"]
          ],
          cards: [
            card("No event sourcing", "Event semantics live in bounded message metadata."),
            card("Current fit", "Raw logs stay on run evidence, not message bodies.")
          ]
        },
        {
          id: "phase-05",
          file: "phase-05-structured-inspector.png",
          label: "Phase 5 Inspector",
          topic: "# review",
          subtitle: "The right review drawer maps current Summary/Diff/Tests/Risk/Memory/Logs into workgroup terms.",
          activeTopic: "review",
          selectedProject: "agenthub-core",
          messages: [
            user("MK", "13:20", "Open the completed Codex run and inspect the injected context plus test results."),
            agent("Codex", "13:25", "Completed the focused change. The run card stays compact until review is opened.", ["open review", "completed"], "completed"),
            system("AH", "13:26", "Review data loaded through window.agentHub.review.* and window.agentHub.memory.*.", ["sandboxed renderer"])
          ],
          reviewTitle: "Run Inspector",
          tabs: ["Brief", "Context", "Artifacts", "Checks", "Risks", "Memory", "Audit"],
          review: [
            ["Brief", "task, status, review decision"],
            ["Context", "conversation_brief artifact"],
            ["Artifacts", "diff and handoff evidence"],
            ["Checks", "verification rows"]
          ],
          cards: [
            card("Current source", "ReviewService aggregates summary, diff, tests, risk, handoff, compare, memory, logs."),
            card("UI simplification", "One right panel; no separate review workspace.")
          ]
        },
        {
          id: "phase-06",
          file: "phase-06-artifact-model.png",
          label: "Phase 6 Artifacts",
          topic: "# knowledge",
          subtitle: "Artifacts appear as small attachments in the chat and detailed rows in review.",
          activeTopic: "knowledge",
          selectedProject: "agenthub-core",
          messages: [
            user("MK", "14:00", "Show the reusable outputs from the last desktop run."),
            agent("Codex", "14:02", "Attached bounded artifacts from existing run_artifacts.", ["conversation_brief", "git_diff", "review_decision"], "completed"),
            system("AH", "14:03", "Full content remains local and bounded; no external publishing action exists.")
          ],
          reviewTitle: "Artifacts",
          review: [
            ["conversation_brief", "context snapshot"],
            ["git_diff", "bounded diff artifact"],
            ["review_decision", "audit-only accept/reject record"]
          ],
          cards: [
            card("Current table", "run_artifacts is the backing store for v0."),
            card("Review rule", "Files are previewed locally; no publish button.")
          ]
        },
        {
          id: "phase-07",
          file: "phase-07-memory-decisions.png",
          label: "Phase 7 Memory",
          topic: "# knowledge",
          subtitle: "Memory governance uses the same chat and review surfaces instead of a dense dashboard.",
          activeTopic: "knowledge",
          selectedProject: "agenthub-core",
          messages: [
            user("MK", "15:10", "Review memory proposals from the last run before adding anything to approved memory."),
            agent("Memory", "15:11", "One proposal is pending. Thread summaries remain thread-local until explicitly promoted.", ["proposal", "not injected"], "pending"),
            system("AH", "15:12", "Approval writes to Agent Hub owned memory/approved.md through explicit IPC only.", ["local writeback"])
          ],
          reviewTitle: "Memory Proposal",
          tabs: ["Memory", "Decisions", "Context", "Tasks", "Risk", "Audit"],
          review: [
            ["Status", "proposed"],
            ["Source", "run_512 / #knowledge"],
            ["Action", "approve or ignore"],
            ["Boundary", "no automatic promotion"]
          ],
          cards: [
            card("Current APIs", "memory.listProposals, generateProposals, approve, ignore."),
            card("Simplification", "Filters are in review, not a full multi-pane knowledge dashboard.")
          ]
        },
        {
          id: "phase-08",
          file: "phase-08-team-role-config.png",
          label: "Phase 8 Roles",
          topic: "# planning",
          subtitle: "Role configuration is previewed as a local settings/review card, while chat stays primary.",
          activeTopic: "planning",
          selectedProject: "agenthub-core",
          messages: [
            user("MK", "16:00", "Draft a lightweight @reviewer role backed by today's adapters, but do not add new runtimes."),
            system("AH", "16:01", "Role handles are design metadata here; current runnable mentions remain @fake, @codex, and @claude.", ["current functionality"]),
            agent("Fake", "16:02", "Suggested role profile: reviewer, read-only evidence, user confirmation for side effects.", ["role preview"], "completed")
          ],
          reviewTitle: "Role Preview",
          review: [
            ["Current mentions", "@fake, @codex, @claude"],
            ["Future handle", "@reviewer"],
            ["Executor", "agent_adapter"],
            ["Safety", "no secrets, no side effects"]
          ],
          cards: [
            card("No complex team page", "The phase can reuse settings and review patterns."),
            card("Local only", "Custom roles must not write to the target repository.")
          ]
        },
        {
          id: "phase-09",
          file: "phase-09-collaboration-workflows.png",
          label: "Phase 9 Workflows",
          topic: "# planning",
          subtitle: "Workflow modes render as ordinary messages and run cards with explicit round limits.",
          activeTopic: "planning",
          selectedProject: "agenthub-core",
          messages: [
            user("MK", "17:00", "Start a two-round review loop for the comparison report work."),
            system("AH", "17:01", "Workflow started: review_loop, max rounds 2, stop condition user decision.", ["bounded rounds"]),
            agent("Codex", "17:05", "Round 1 implementation run completed in an isolated worktree.", ["round 1", "run card"], "completed"),
            agent("Reviewer", "17:09", "Findings recorded. No apply, merge, push, or cleanup was performed.", ["review-only"], "completed")
          ],
          reviewTitle: "Workflow Review",
          review: [
            ["Mode", "review_loop"],
            ["Max rounds", "2"],
            ["Stop", "user decision"],
            ["Side effects", "none outside worktrees"]
          ],
          cards: [
            card("Current fit", "Uses TaskRunner runs and conversation briefs."),
            card("Simplification", "No autonomous participant chat.")
          ]
        },
        {
          id: "phase-11",
          file: "phase-11-pack-boundaries.png",
          label: "Phase 11 Packs",
          topic: "# review",
          subtitle: "Pack labels stay lightweight: core review tabs remain stable, engineering words appear inside evidence.",
          activeTopic: "review",
          selectedProject: "agenthub-core",
          messages: [
            user("MK", "18:20", "Keep product language general, but still show engineering evidence when reviewing code runs."),
            system("AH", "18:21", "Core tabs stay Brief, Context, Artifacts, Checks, Risks, Memory, Audit.", ["core workgroup"]),
            agent("Codex", "18:23", "Engineering pack labels appear inside Artifacts and Checks: diff, tests, worktree, CI.", ["pack metadata"], "completed")
          ],
          reviewTitle: "Pack Mapping",
          tabs: ["Brief", "Artifacts", "Checks", "Risks", "Memory", "Audit"],
          review: [
            ["Core term", "Artifacts"],
            ["Engineering label", "Diff summary"],
            ["Core term", "Checks"],
            ["Engineering label", "Tests / CI"]
          ],
          cards: [
            card("Current fit", "Existing Diff and Tests panels are retained as engineering-specific content."),
            card("No marketplace", "Built-in deterministic metadata only.")
          ]
        },
        {
          id: "phase-12",
          file: "phase-12-apply-lifecycle-controls.png",
          label: "Phase 12 Lifecycle",
          topic: "# review",
          subtitle: "Lifecycle controls live in review, gated by preview and explicit local confirmation.",
          activeTopic: "review",
          selectedProject: "agenthub-core",
          messages: [
            user("MK", "19:00", "Inspect the retained worktree from the failed Codex run."),
            agent("Codex", "19:02", "Run failed inspectably. Retained worktree handoff is available for manual review.", ["handoff", "failed"], "failed"),
            system("AH", "19:03", "Open/copy actions are review-only IPC calls. No cleanup, merge, push, or apply happens automatically.", ["manual handoff"])
          ],
          reviewTitle: "Handoff / Lifecycle",
          tabs: ["Summary", "Handoff", "Diff", "Tests", "Risk", "Logs"],
          review: [
            ["Worktree", "~/.agent-hub/worktrees/..."],
            ["Available now", "open worktree, copy review command"],
            ["Future gated", "cleanup and apply require confirmation"],
            ["Blocking risk", "prevents apply"]
          ],
          cards: [
            card("Current boundary", "ReviewService returns review-only commands."),
            card("Design target", "Apply/cleanup controls stay in right review panel.")
          ]
        }
      ];

      function user(author, time, text) {
        return { kind: "user", author, time, text, avatar: author.slice(0, 2), color: "blue" };
      }

      function system(author, time, text, chips = []) {
        return { kind: "system", author, time, text, avatar: "AH", color: "amber", chips };
      }

      function agent(author, time, text, chips = [], status = "completed") {
        const colors = {
          Fake: "cyan",
          Codex: "green",
          Memory: "violet",
          Reviewer: "orange"
        };
        return {
          kind: "agent",
          author,
          time,
          text,
          avatar: author.slice(0, 2),
          color: colors[author] || "cyan",
          chips,
          status
        };
      }

      function card(title, body) {
        return { title, body };
      }

      function renderPhase(phase) {
        const tabs = phase.tabs || currentTabs;
        return `
          <article class="mockup" id="${phase.id}" data-file="${phase.file}">
            <div class="app">
              <header class="topbar">
                <div class="traffic"><span></span><span></span><span></span></div>
                <div class="window-title">Agent Hub</div>
                <div class="top-actions">
                  <span class="icon">S</span>
                  <span class="icon">></span>
                  <span class="icon">G</span>
                  <span class="pill green">Local</span>
                </div>
              </header>

              <aside class="sidebar">
                <div class="project-switcher">
                  <div class="brand-mark">AH</div>
                  <div>
                    <div class="project-name">${phase.selectedProject}</div>
                    <div class="small">local project</div>
                  </div>
                  <div class="small">v</div>
                </div>

                <section class="section">
                  <div class="section-label"><span>Projects</span><span>+</span></div>
                  ${projectRow("agenthub-core", phase.selectedProject === "agenthub-core", "active")}
                  ${projectRow("trader", phase.selectedProject === "trader", "idle")}
                  ${projectRow("docs-site", phase.selectedProject === "docs-site", "idle")}
                </section>

                <section class="section">
                  <div class="section-label"><span>Topics</span><span>+</span></div>
                  ${topicRow("general", phase.activeTopic)}
                  ${topicRow("planning", phase.activeTopic)}
                  ${topicRow("research", phase.activeTopic)}
                  ${topicRow("review", phase.activeTopic)}
                  ${topicRow("knowledge", phase.activeTopic)}
                </section>

                <section class="section">
                  <div class="section-label"><span>Runs</span><span>current</span></div>
                  ${statusRow("Open", "5", "blue")}
                  ${statusRow("Running", "2", "amber")}
                  ${statusRow("Needs review", "1", "orange")}
                  ${statusRow("Accepted", "18", "green")}
                </section>

                <div class="footer-state">
                  <div class="status-row"><span class="status-dot"></span><span>Local-first</span><span></span></div>
                  <div class="status-row"><span class="topic-hash">#</span><span>Runtime injection</span><span></span></div>
                </div>
              </aside>

              <main class="main">
                <header class="room-header">
                  <div class="topic-icon">#</div>
                  <div>
                    <div class="phase-label">${phase.label}</div>
                    <h1 class="room-title">${phase.topic}</h1>
                    <p class="room-subtitle">${phase.subtitle}</p>
                  </div>
                  <div class="room-actions">
                    <span class="pill blue">Timeline</span>
                    <span class="pill">Thread</span>
                    <span class="pill">Review</span>
                  </div>
                </header>

                <section class="chat-scroll">
                  <div class="message-list">
                    ${phase.messages.map(renderMessage).join("")}
                  </div>
                </section>

                <footer class="composer">
                  <span class="icon">+</span>
                  <span class="composer-input">@agent message this topic, for example: @fake summarize the latest run</span>
                  <span class="icon">@</span>
                  <span class="icon send">></span>
                </footer>
              </main>

              <aside class="right">
                <nav class="review-tabs">
                  ${tabs.map((tab, index) => `<span class="${index === 0 ? "active" : ""}">${tab}</span>`).join("")}
                </nav>
                <div class="review-stack">
                  <section class="review-card">
                    <h3>${phase.reviewTitle}</h3>
                    ${phase.review.map(([key, value]) => `<div class="kv-row"><span>${key}</span><strong>${value}</strong></div>`).join("")}
                  </section>
                  ${phase.cards.map((item) => `
                    <section class="review-card">
                      <h3>${item.title}</h3>
                      <p>${item.body}</p>
                    </section>
                  `).join("")}
                  <section class="review-card">
                    <h3>Current Boundary</h3>
                    <p>Renderer stays sandboxed. Review details load through main-process IPC; no merge, push, apply, cleanup, or memory approval happens automatically.</p>
                  </section>
                </div>
              </aside>
            </div>
          </article>
        `;
      }

      function projectRow(name, selected, state) {
        return `
          <div class="project-row ${selected ? "selected" : ""}">
            <span class="project-dot"></span>
            <span class="row-title">${name}</span>
            <span class="count">${state}</span>
          </div>
        `;
      }

      function topicRow(topic, activeTopic) {
        const selected = topic === activeTopic;
        return `
          <div class="topic-row ${selected ? "selected" : ""}">
            <span class="topic-hash">#</span>
            <span class="row-title">${topic}</span>
            <span class="count">${selected ? "open" : ""}</span>
          </div>
        `;
      }

      function statusRow(label, count, color) {
        return `
          <div class="status-row">
            <span class="pill ${color}"></span>
            <span>${label}</span>
            <span class="count">${count}</span>
          </div>
        `;
      }

      function renderMessage(message) {
        const chips = message.chips || [];
        return `
          <div class="message ${message.kind}">
            <div class="avatar ${message.color}">${message.avatar}</div>
            <div class="message-body">
              <div class="message-head">
                <strong>${message.author}</strong>
                ${message.kind === "agent" ? `<span class="review-state ${message.status === "failed" ? "red" : "green"}">${message.status}</span>` : ""}
              </div>
              <p>${message.text}</p>
              ${chips.length ? `<div class="chips">${chips.map(chip).join("")}</div>` : ""}
              ${message.kind === "agent" ? runCard(message) : ""}
            </div>
            <span class="time">${message.time}</span>
          </div>
        `;
      }

      function chip(value) {
        const lower = value.toLowerCase();
        const color = lower.includes("risk") || lower.includes("failed") ? "red"
          : lower.includes("memory") || lower.includes("proposal") || lower.includes("role") ? "violet"
          : lower.includes("check") || lower.includes("completed") || lower.includes("local") ? "green"
          : lower.includes("run") || lower.includes("context") || lower.includes("thread") ? "blue"
          : "amber";
        return `<span class="chip ${color}">${value}</span>`;
      }

      function runCard(message) {
        return `
          <div class="run-card">
            <div>
              <h3>Inline run card</h3>
              <p class="small">Latest line, compact evidence pills, and on-demand inspector stay aligned with today's desktop.</p>
            </div>
            <span class="pill blue">Open review</span>
          </div>
        `;
      }

      document.getElementById("root").innerHTML = phases.map(renderPhase).join("");
    </script>
  </body>
</html>
