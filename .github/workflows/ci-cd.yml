name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.10.0"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: Summarize coverage
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            {
              echo "### Coverage"
              echo ""
              echo "Coverage summary was not generated."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");

          const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
          const total = summary.total;
          const metrics = ["lines", "statements", "branches", "functions"];

          console.log("### Coverage");
          console.log("");
          console.log("Coverage is reported for visibility only. No threshold is enforced yet.");
          console.log("");
          console.log("| Metric | Covered | Total | Pct |");
          console.log("| --- | ---: | ---: | ---: |");

          for (const metric of metrics) {
            const value = total[metric];
            console.log(`| ${metric} | ${value.covered} | ${value.total} | ${value.pct}% |`);
          }
          NODE

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      - name: Build
        run: pnpm build

      - name: Build desktop bundle
        run: pnpm desktop:build

  package:
    name: Package
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package artifact
        run: |
          pnpm build
          mkdir -p artifacts
          safe_ref="${GITHUB_REF_NAME//\//-}"
          tar -czf "artifacts/agent-hub-${safe_ref}.tgz" .github/workflows/ci-cd.yml apps packages scripts tests package.json README.md pnpm-workspace.yaml pnpm-lock.yaml tsconfig.json tsconfig.build.json vitest.config.ts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-hub-package
          path: artifacts/*.tgz
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    needs: validate
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS DMG
        run: bash scripts/build-macos-dmg.sh ${{ matrix.arch }}

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-hub-macos-dmg-${{ matrix.arch }}
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  release:
    name: Release
    needs:
      - package
      - macos-dmg
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-hub-package
          path: artifacts

      - name: Download macOS DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agent-hub-macos-dmg-*
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/*.dmg --generate-notes --title "$GITHUB_REF_NAME"
          fi
